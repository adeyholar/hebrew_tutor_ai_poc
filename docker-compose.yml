services:
  backend:
    build: ./docker/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/hebrew_tutor.db
    volumes:
      - ./data:/app/data
      - ./ .env:/app/.env
      - ./cert.pem:/app/cert.pem
      - ./key.pem:/app/key.pem
  frontend:
    build: ./docker/frontend
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app