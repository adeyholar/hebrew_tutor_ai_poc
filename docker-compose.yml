version: '3.8'
services:
  backend:
    build: ./docker/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/hebrew_tutor.db
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      - db
  db:
    image: sqlite:latest
    volumes:
      - ./data:/data
  frontend:
    build: ./docker/frontend
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app